<div class="overflow-x-auto">
  <div class="grid min-w-[720px]" style="grid-template-columns: 80px repeat(4, 1fr);">
    <div class="sticky top-0 z-10 border-b border-border bg-surface p-2 text-xs font-semibold text-text-secondary">TC</div>
    <div class="sticky top-0 z-10 border-b border-l border-border bg-surface p-2 text-xs font-semibold text-text-secondary" *ngFor="let track of trackOrder">
      {{ trackLabels[track] }}
    </div>

    <ng-container *ngFor="let row of timeline.rows">
      <div class="sticky left-0 border-b border-border bg-surface p-2 font-mono text-xs text-text-secondary"
           [class.border-dashed]="row.isClamped"
           [style.min-height.px]="row.heightPx">
        {{ row.beat.timecode }}
        <p class="mt-1 font-sans text-[10px] text-text-secondary">{{ row.beat.purpose }}</p>
      </div>
      <div class="border-b border-l border-border p-1" *ngFor="let track of trackOrder" [style.min-height.px]="row.heightPx">
        <div class="mb-1 rounded-md border border-border bg-bg p-2" *ngFor="let clip of row.tracks[track]"
             [class.border-l-4]="true"
             [ngClass]="{
               'border-l-track-dialogue': track === 'dialogue',
               'border-l-track-broll': track === 'broll',
               'border-l-track-screen': track === 'screen',
               'border-l-track-graphic': track === 'graphics'
             }">
          <div class="flex flex-wrap items-center gap-1">
            <span class="font-mono text-xs text-text-secondary">{{ clip.asset.code }}</span>
            <span *ngIf="clip.isReuse" class="text-[10px] text-text-secondary" title="Reused from an earlier beat">&#8635;</span>
            <span class="rounded-full px-1.5 py-0.5 text-[10px] font-medium text-white" [ngClass]="statusPillClass(clip.asset.status)">
              {{ clip.asset.status }}
            </span>
          </div>
          <p class="mt-1 text-xs font-medium">{{ clip.asset.title }}</p>
          <p class="text-[10px] text-text-secondary" *ngIf="clip.asset.targetLengthSeconds">{{ clip.asset.targetLengthSeconds }}s</p>
        </div>
      </div>
    </ng-container>
  </div>
</div>

<div class="mt-6 rounded-lg border border-border bg-surface p-4" *ngIf="timeline.unscheduled.length > 0">
  <h4 class="mb-3 text-sm font-semibold text-text-secondary">Unscheduled</h4>
  <div class="space-y-2">
    <div class="rounded-md border border-border bg-bg p-3" *ngFor="let row of timeline.unscheduled">
      <p class="font-mono text-xs text-text-secondary">{{ row.beat.timecode }}</p>
      <p class="text-sm">{{ row.beat.purpose }}</p>
    </div>
  </div>
</div>

<div class="mt-6 rounded-lg border border-border bg-surface p-4" *ngIf="timeline.unassigned.length > 0">
  <h4 class="mb-3 text-sm font-semibold text-text-secondary">Unassigned</h4>
  <div class="flex flex-wrap gap-2">
    <div class="rounded-md border border-border bg-bg px-3 py-2" *ngFor="let asset of timeline.unassigned">
      <span class="font-mono text-xs text-text-secondary">{{ asset.code }}</span>
      <span class="ml-2 text-sm">{{ asset.title }}</span>
    </div>
  </div>
</div>
